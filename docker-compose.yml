services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: arogyamesh
      POSTGRES_USER: arogyamesh
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arogyamesh"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://arogyamesh:local-demo-only@database:5432/arogyamesh
      DEMO_MODE: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      database:
        condition: service_healthy
    ports: ["127.0.0.1:8100:8100"]
    volumes:
      - synthetic-data:/app/data/synthetic
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        API_ORIGIN: http://api:8100
    environment:
      API_ORIGIN: http://api:8100
    depends_on: [api]
    ports: ["127.0.0.1:3100:3100"]
volumes:
  postgres-data:
  synthetic-data:
